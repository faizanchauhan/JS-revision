<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body style="background-color :#212121; ; color:#fff">
    <ul class="lang">
        <li>javascript</li>
    </ul>

</body>
<script>
    // this way isnt that much efficient and optimized
    function addLang(langName) {
        const li = document.createElement("li")
        li.innerHTML = `${langName}`
        document.querySelector(".lang").appendChild(li)
    };
    addLang("python")
    addLang("cpp")

    // an optimized way

    function optiLang(langName) {
        const li = document.createElement("li")
        li.appendChild(document.createTextNode(langName))
        document.querySelector(".lang").appendChild(li)
    }
    optiLang("rust")
    optiLang("golang")

    // edit

    const secLang = document.querySelector("li:nth-child(2)"); // python
    // secLang.innerHTML = "ruby"
    const newli = document.createElement("li")
    newli.textContent = "ruby"
    secLang.replaceWith(newli)

    // edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>net</li>"

    // remove
    const secondLang = document.querySelector("li:last-child")
    secondLang.remove()
</script>

</html>
